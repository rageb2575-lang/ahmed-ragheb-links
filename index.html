<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ahmed Ragheb El-Houty</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:sans-serif;display:flex;justify-content:center;padding:20px;min-height:100vh}
.box{width:100%;max-width:380px;text-align:center}
.avatar-wrap{position:relative;width:170px;height:170px;margin:50px auto 15px}
.avatar{width:150px;height:150px;border-radius:50%;object-fit:cover;border:4px solid #FFD700;box-shadow:0 0 30px rgba(255,215,0,0.8),0 0 60px rgba(255,215,0,0.3);display:block;margin:auto}
.crown{position:absolute;top:-35px;left:50%;transform:translateX(-50%);font-size:42px;filter:drop-shadow(0 0 12px gold);z-index:2}
h1{margin:15px 0 5px;font-size:27px;font-weight:900;letter-spacing:0.5px}
.bio{color:#FFD700;font-size:15px;margin-bottom:30px;letter-spacing:0.5px}
.link{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,#1e1e1e,#151515);color:#fff;text-decoration:none;padding:18px 24px;border-radius:35px;margin-bottom:14px;font-size:17px;font-weight:700;border:1px solid #2a2a2a;box-shadow:0 4px 10px rgba(0,0,0,0.5)}
.link:hover{border-color:#FFD700;box-shadow:0 0 20px rgba(255,215,0,0.4);transform:translateY(-2px)}
.link i{font-size:26px}
.qr-section{margin-top:35px;position:relative}
.qr-glow{position:absolute;bottom:25px;left:50%;transform:translateX(-50%);width:200px;height:60px;background:radial-gradient(ellipse at center, rgba(255,215,0,0.6) 0%, transparent 70%);filter:blur(10px)}
.qr-box{margin:0 auto;background:linear-gradient(145deg,#FFD700,#FFA500);padding:3px;border-radius:20px;width:200px;box-shadow:0 0 30px rgba(255,215,0,0.8)}
.qr-inner{background:#fff;border-radius:17px;padding:8px}
.qr-inner img{width:100%;display:block;border-radius:10px}
.scan-wrap
