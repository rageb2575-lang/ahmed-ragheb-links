body{margin:0;background:#000;color:#fff;font-family:Arial;text-align:center;min-height:100vh;overflow-x:hidden}
.page{position:relative;width:100%;max-width:400px;margin:0 auto;min-height:100vh;background:#000;padding:20px;overflow:hidden}
/* العلامة الدهبي فوق على الشمال زي الصورة */
.gold-corner{position:absolute;top:0;left:0;width:120px;height:120px;overflow:hidden}
.gold-corner::before{content:'';position:absolute;top:15px;left:-30px;width:150px;height:18px;background:linear-gradient(90deg,#FFD700,#8B7500);transform:rotate(-45deg);box-shadow:0 0 10px gold}
.gold-corner::after{content:'';position:absolute;top:35px;left:-25px;width:150px;height:6px;background:linear-gradient(90deg,#FFD700,#8B7500);transform:rotate(-45deg)}
.top-line{position:absolute;top:0;right:0;width:70%;height:5px;background:linear-gradient(90deg,#8B7500,#FFD700)}

.avatar-wrap{position:relative;width:160px;height:160px;margin:60px auto 10px}
.avatar{width:145px;height:145px;border-radius:50%;object-fit:cover;border:3px solid #FFD700;display:block;margin:auto;box-shadow:0 0 15px rgba(255,215,0,0.6)}
.crown-img{position:absolute;top:-28px;left:50%;transform:translateX(-50%);font-size:42px;filter:drop-shadow(0 2px 5px gold)}
.laurel{position:absolute;top:10px;font-size:58px;color:#d4af37}
.laurel.left{left:-18px;transform:scaleX(-1)}
.laurel.right{right:-18px}

h1{font-size:26px;font-weight:900;margin:15px 0 5px;line-height:1.2}
.bio{color:#FFD700;font-size:15px;margin-bottom:20px}

.btn{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#1e1e1e,#151515);color:#fff;text-decoration:none;padding:16px 22px;border-radius:30px;margin:0 auto 11px;max-width:340px;border:1px solid #222;font-weight:bold}
.btn:hover{border-color:gold}

.qr-wrap{position:relative;margin:35px auto 0;width:210px}
.qr-glow{position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:190px;height:190px;background:radial-gradient(circle, rgba(255,215,0,0.9) 0%, rgba(255,215,0,0.3) 40%, transparent 70%);filter:blur(8px)}
.qr-card{position:relative;background:linear-gradient(#FFD700,#FFA500);padding:3px;border-radius:18px;box-shadow:0 0 25px gold}
.qr-inner{background:#fff;padding:7px;border-radius:15px}
.qr-inner img{width:100%;display:block;border-radius:10px}
.pedestal{width:220px;height:55px;background:radial-gradient(ellipse at center, #FFD700 0%, #8B7500 50%, #000 75%);border-radius:50%;margin:-25px auto 0;box-shadow:0 -10px 20px rgba(255,215,0,0.6);border-top:2px solid gold}
.scan-row{margin-top:8px;display:flex;justify-content:center;align-items:center;gap:10px}
.scan-btn{background:linear-gradient(#FFD700,#FFC400);color:#000;padding:7px 20px;border-radius:20px;font-weight:900;font-size:14px;display:flex;gap:6px;align-items:center;box-shadow:0 0 15px gold}
.arr{color:gold;font-weight:900;font-size:20px}
