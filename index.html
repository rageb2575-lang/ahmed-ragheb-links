<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh}
.page{position:relative;width:100%;max-width:400px;min-height:100vh;background:#000;padding:20px 16px;overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center}
.gold-corner{position:absolute;top:0;left:0;width:140px;height:140px;overflow:hidden;z-index:10}
.gold-corner::before{content:'';position:absolute;top:18px;left:-35px;width:170px;height:22px;background:linear-gradient(90deg,#FFF200,#FFD700);transform:rotate(-45deg);box-shadow:0 0 15px #FFD700,0 0 30px #FFD700}
.gold-corner::after{content:'';position:absolute;top:42px;left:-30px;width:170px;height:7px;background:linear-gradient(90deg,#FFF200,#FFD700);transform:rotate(-45deg);box-shadow:0 0 10px gold}
.top-line{position:absolute;top:0;right:0;width:72%;height:6px;background:linear-gradient(90deg,#FFD700,#FFF176,#FFD700);box-shadow:0 0 15px gold;z-index:10}

.center-box{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1}
.avatar-wrap{width:165px;height:165px;margin:0 auto 12px}
.avatar{width:155px;height:155px;border-radius:50%;object-fit:cover;border:3px solid #FFD700;display:block;margin:auto;box-shadow:0 0 25px rgba(255,215,0,0.9)}

h1{font-size:26px;font-weight:900;margin:18px 0 4px;text-align:center;min-height:35px}
.bio{color:#FFD700;font-size:15px;margin-bottom:22px;text-align:center;opacity:0;animation:fadeIn 1s ease 2.5s forwards}

.buttons{width:100%;display:flex;flex-direction:column;gap:14px}
.btn{position:relative;display:flex;justify-content:space-between;align-items:center;background:#161616;color:#fff;text-decoration:none;padding:17px 22px;border-radius:30px;width:100%;border:1px solid #333;font-weight:bold;font-size:18px;overflow:hidden;transition:transform 0.15s ease, filter 0.15s ease;animation:pulseGold 2s infinite; border-color:rgba(255,215,0,0.4)}
.btn:active{transform:scale(0.92);filter:brightness(0.7)}

@keyframes pulseGold{
  0%{box-shadow:0 0 0 0 rgba(255,215,0,0.6)}
  70%{box-shadow:0 0 0 12px rgba(255,215,0,0)}
  100%{box-shadow:0 0 0 0 rgba(255,215,0,0)}
}
/* خلي كل زرار ينبض في وقت مختلف عشان شكلها اجمد */
.buttons a:nth-child(1){animation-delay:0s}
.buttons a:nth-child(2){animation-delay:0.2s}
.buttons a:nth-child(3){animation-delay:0.4s}
.buttons a:nth-child(4){animation-delay:0.6s}
.buttons a:nth-child(5){animation-delay:0.8s}
.buttons a:nth-child(6){animation-delay:1s}

@keyframes fadeIn{to{opacity:1}}
.cursor{border-right:2px solid #FFD700;animation:blink 0.7s infinite}
@keyframes blink{50%{border-color:transparent}}
</style>
</head>
