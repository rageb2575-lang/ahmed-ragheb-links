<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<h1>Ahmed Ragheb El-Houty</h1>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000000;color:#fff;font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;display:flex;justify-content:center;padding:20px;min-height:100vh}
  .box{width:100%;max-width:380px;text-align:center;margin-top:20px}
  .avatar{width:120px;height:120px;border-radius:50%;border:3px solid #222;object-fit:cover;box-shadow:0 0 20px rgba(255,255,255,0.1)}
  h1{margin:18px 0 8px;font-size:32px;font-weight:900;letter-spacing:1px}
  .bio{color:#888;font-size:14px;margin-bottom:30px}
  .link{display:flex;align-items:center;gap:18px;background:#111111;border:1px solid #1A1A1A;color:#fff;text-decoration:none;padding:19px 24px;border-radius:28px;margin-bottom:14px;font-size:17px;font-weight:700;transition:0.2s}
  .link i{font-size:24px;width:30px;text-align:center}
  .link:hover{background:#fff;color:#000;transform:translateY(-2px);box-shadow:0 5px 20px rgba(255,255,255,0.2)}
  .link:active{transform:scale(0.98)}
</style>
</head>
<body>
<div class="box">
  <img src="https://i.pravatar.cc/300" alt="Ahmed Ragheb" class="avatar">
  <h1>Ahmed Ragheb</h1>
  <div class="bio">احمد راغب | تابعني ✨</div>

  <a class="link" href="#"><i class="fab fa-facebook" style="color:#1877F2"></i> Facebook</a>
  <a class="link" href="#"><i class="fab fa-instagram" style="color:#E4405F"></i> Instagram</a>
  <a class="link" href="#"><i class="fab fa-tiktok"></i> TikTok</a>
  <a class="link" href="#"><i class="fab fa-whatsapp" style="color:#25D366"></i> WhatsApp</a>
  <a class="link" href="#"><i class="fa-brands fa-youtube" style="color:#FF0000"></i> YouTube</a>
</div>
</body>
</html>
